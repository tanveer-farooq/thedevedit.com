<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav aria-label="Breadcrumb" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:'Space Mono',monospace;font-size:12px;line-height:18px;color:#666">
  <a href="Home 3.dc.html" style="color:#666;text-decoration:none" style-hover="color:#121212">Home</a>
  <span aria-hidden="true">›</span>
  <sc-if value="{{ hasCat }}" hint-placeholder-val="{{ true }}">
    <a href="{{ catHref }}" style="color:#666;text-decoration:none" style-hover="color:#121212">{{ catName }}</a>
  </sc-if>
  <sc-if value="{{ hasCatAndTitle }}" hint-placeholder-val="{{ true }}">
    <span aria-hidden="true">›</span>
  </sc-if>
  <span aria-current="page" style="color:#121212">{{ title }}</span>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;600px&quot;,&quot;height&quot;:&quot;40px&quot;},&quot;category&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ai&quot;,&quot;dev-tools&quot;,&quot;testing&quot;,&quot;devops&quot;,&quot;data&quot;,&quot;security&quot;,&quot;it-management&quot;,&quot;productivity&quot;],&quot;default&quot;:&quot;testing&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Best automation testing tools&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const CAT_NAMES = { 'ai': 'AI & LLMs', 'dev-tools': 'Developer Tools', 'testing': 'Testing & QA', 'devops': 'DevOps & Observability', 'data': 'Data & Databases', 'security': 'Security', 'it-management': 'IT Management', 'productivity': 'Productivity & Collaboration' };
class Component extends DCLogic {
  renderVals() {
    const cat = this.props.category;
    const name = CAT_NAMES[cat];
    const title = this.props.title ?? '';
    return { hasCat: !!name, hasCatAndTitle: !!name && !!title, catName: name, catHref: 'Category Hub.dc.html?category=' + cat, title };
  }
}
</script>
</body>
</html>
