<!DOCTYPE html>

<header style="width:100%;font-family:'BDO Grotesk','Manrope',sans-serif;position:relative;z-index:30">

          <sc-for list="{{ links }}" as="ln" hint-placeholder-count="4">
            <a href="{{ ln.href }}" style="height:36px;padding:0 12px;display:flex;align-items:center;color:#121212;text-decoration:none;white-space:nowrap;border-bottom:2px solid {{ ln.bar }}" style-hover="background:#fff">{{ ln.label }}</a>

        </sc-if>

        </sc-for>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{ searchOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeSearch }}" style="position:fixed;inset:0;background:rgba(18,18,18,.55);z-index:100;display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px">
      <div onClick="{{ stop }}" role="dialog" aria-label="Search" style="width:min(680px,100%);max-height:76vh;display:flex;flex-direction:column;background:#fff;border:1px solid #121212;box-shadow:0 24px 48px rgba(18,18,18,.25)">
        <div style="display:flex;align-items:center;gap:12px;padding:0 16px;height:60px;border-bottom:1px solid #D3D2CD;color:#666">
          {{ icSearch }}
          <input ref="{{ inputRef }}" value="{{ q }}" onChange="{{ onQ }}" placeholder="Search reviews and articles" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:18px;color:#121212">
          <button type="button" onClick="{{ closeSearch }}" style="height:26px;padding:0 8px;border:1px solid #D3D2CD;background:#fff;font-family:'JetBrains Mono',monospace;font-size:11px;color:#666;cursor:pointer">ESC</button>
        </div>
        <div style="overflow-y:auto;padding:8px 0">
          <span style="display:block;padding:8px 16px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;color:#7f806f">{{ resultsLabel }}</span>
          <sc-for list="{{ results }}" as="r" hint-placeholder-count="6">
            <a href="{{ r.href }}" style="display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;color:#121212;text-decoration:none" style-hover="background:#F5F4F0">
              <span style="width:36px;height:36px;border:1px solid #D3D2CD;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500">{{ r.mark }}</span>
              <span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:15px;font-weight:500">{{ r.title }}</span><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.url }}</span></span>
              <span style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.06em;color:#7f806f;white-space:nowrap">{{ r.kind }}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;420px&quot;}}">

</script>
